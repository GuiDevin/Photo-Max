<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoMax — Redirecionando…</title>
    <!--
      SPA fallback for GitHub Pages.
      When a user hits a deep URL like /Photo-Max/tarefas, GitHub Pages serves this
      404.html. We capture the path, persist it in sessionStorage, and redirect to
      index.html. index.html's bootstrap script then restores the route via
      history.replaceState so React Router picks it up.
    -->
    <link rel="icon" type="image/svg+xml" href="/Photo-Max/favicon.svg" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pm-loader { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .pm-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(124, 58, 237, 0.25);
        border-top-color: #7c3aed;
        border-radius: 999px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 13px; color: #94a3b8; }
    </style>
    <script>
      (function () {
        try {
          var path = window.location.pathname || '/';
          // Strip the repo prefix to recover the in-app route
          var prefix = '/Photo-Max';
          if (path.indexOf(prefix) === 0) {
            var inner = path.slice(prefix.length) || '/';
            sessionStorage.setItem('pm:redirect', inner + window.location.search + window.location.hash);
          }
        } catch (e) { /* sessionStorage may be disabled */ }
        window.location.replace('/Photo-Max/');
      })();
    </script>
  </head>
  <body>
    <div class="pm-loader">
      <div class="pm-spinner" aria-hidden></div>
      <h1>PhotoMax</h1>
      <p>Carregando…</p>
    </div>
  </body>
</html>
