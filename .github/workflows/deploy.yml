name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Restrict the GITHUB_TOKEN so a compromised step can't go beyond Pages writes.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing for the same Pages slot.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        # vite.config.ts detects production and defaults base to /Photo-Max/,
        # which matches the GitHub Pages project URL.
        run: npm run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4